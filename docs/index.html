<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云音乐 - 在线音乐播放器</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <header>
            <h1 class="logo"><i class="fab fa-cloudsmith"></i> 云音乐</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索歌曲、歌手...">
                <button id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
            </div>
            <div class="playlist-import">
                <input type="text" id="playlistInput" placeholder="输入歌单 ID (网易云)">
                <button id="importBtn"><i class="fas fa-file-import"></i> 导入歌单</button>
            </div>
        </header>

        <main>
            <div id="resultsContainer" class="results-container">
                <div class="welcome-screen">
                    <i class="fas fa-headphones-alt"></i>
                    <h2>开始享受音乐</h2>
                    <p>搜索你喜欢的歌曲或导入网易云歌单</p>
                </div>
            </div>
        </main>

        <footer>
            <div class="player">
                <div class="track-info">
                    <div class="album-art" id="playerAlbumArt">
                        <i class="fas fa-music"></i>
                    </div>
                    <div class="track-text">
                        <div id="playerTrackName" class="track-name">未在播放</div>
                        <div id="playerArtist" class="track-artist">-</div>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="control-btns">
                        <button id="prevBtn" title="上一首"><i class="fas fa-step-backward"></i></button>
                        <button id="playBtn" class="play-toggle" title="播放/暂停"><i class="fas fa-play"></i></button>
                        <button id="nextBtn" title="下一首"><i class="fas fa-step-forward"></i></button>
                    </div>
                    <div class="progress-container">
                        <span id="currentTime">00:00</span>
                        <div class="progress-bar" id="progressBar">
                            <div class="progress" id="progress"></div>
                        </div>
                        <span id="totalTime">00:00</span>
                    </div>
                </div>

                <div class="volume-container">
                    <i class="fas fa-volume-up" id="muteBtn"></i>
                    <div class="volume-bar" id="volumeBar">
                        <div class="volume" id="volume" style="width: 80%"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div id="notification" class="notification"></div>
    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>
</html>
